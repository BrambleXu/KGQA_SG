[project]
name = "kgqa-sg"
version = "0.2.0"
description = "Three Kingdoms character relationships and bounded graph queries."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["flask>=3.1.3,<4"]

[project.optional-dependencies]
neo4j = ["neo4j>=6.3,<7"]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.16,<0.17", "pip-audit>=2.10.1,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
include = ["app.py", "graph_data.py", "KGQA/ltp.py", "neo_db/*.py", "tests/*.py", "scripts/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
